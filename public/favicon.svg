<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1510" />
      <stop offset="100%" stop-color="#080807" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE6B6" />
      <stop offset="45%" stop-color="#D9A85B" />
      <stop offset="100%" stop-color="#A16E28" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded luxury icon tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Iconic Sufi Arch Crest (from brand logo) -->
  <g transform="translate(14, 10)">
    <path
      d="M 3 20 C 7 13, 13 4.5, 18 2 C 23 4.5, 29 13, 33 20"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="2.6"
      stroke-linecap="round"
      filter="url(#goldGlow)"
    />
    <circle cx="18" cy="2" r="2.2" fill="url(#goldGrad)" />
  </g>

  <!-- QW Monogram in elegant serif styling -->
  <text
    x="32"
    y="49"
    text-anchor="middle"
    font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif"
    font-size="16"
    font-weight="700"
    letter-spacing="1.5"
    fill="url(#goldGrad)"
  >QW</text>
</svg>
